[workspace]
resolver = "2"

members = [
    "jup-interface",
]

[workspace.package]
edition = "2021"
license-file = "LICENSE"
version = "0.1.0"

[workspace.dependencies]
# In general, keep default-features = false in workspace
# and enable individual features in indiv crates
anyhow = { version = "^1", default-features = false }
backoff = { version = "^0.4", default-features = false }
ureq = { version = "^3", default-features = false }

# solana crates
# Version constraints below follow the Agave 4.1 compatibility set used by
# jupiter-core.
solana-pubkey = { version = "^4.2.0", default-features = false }
solana-sha256-hasher = { version = "^3.1.0", default-features = false }

# sanctum-lst-list
sanctum-lst-list = { git = "https://github.com/jup-ag/sanctum-lst-list.git", rev = "dbf31ad5e91e4b0f7402c05bc56c779b4049c8c7" }

# inf-1.5 crates
inf1-std = { git = "https://github.com/igneous-labs/inf-1.5.git", branch = "master" }
